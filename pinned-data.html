<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Migrated PDB Protvista pinned data demo</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Icon fonts stylesheet -->
    <link
      rel="stylesheet"
      href="https://ebi.emblstatic.net/web_guidelines/EBI-Icon-fonts/v1.2/fonts.css"
      type="text/css"
      media="all"
    />

    <!--
    <link rel="stylesheet" href="/styles/protvista-pdb.css" />
    <link rel="stylesheet" href="/styles/protvista-variation.css" />
    <link rel="stylesheet" href="/dist/protvista-pdb-4.0.0-mddb.min.css" />
    -->
  </head>

  <body>
    <h1>Migrated PDB Protvista pinned data demo</h1>

    <protvista-pdb
      accession="P24666"
      max-height="600px"
      always-expanded="unipdb,ligand_sites,interface_residues,annotations,3dbeacons,sequence_conservation,variation"
      enable-in3d
      trigger-first-in3d
      add-custom-track
      new-toolbar
    ></protvista-pdb>

    <script type="module" src="/src/index.js"></script>

    <script type="module">
      const pv = document.querySelector("protvista-pdb");

      pv.pinneddata = [
        {
          labelType: "text",
          label: "Placeholder",
          data: [
            {
              accession: "placeholder",
              labelType: "text",
              label: "Example pinned annotation",
              color: "rgb(128,128,128)",
              labelColor: "rgb(211,211,211)",
              type: "UniProt range",
              labelTooltip: "Example placeholder track",
              locations: [
                {
                  fragments: [
                    {
                      start: 30,
                      end: 70,
                      color: "rgb(0,120,255)",
                      tooltipContent: "Placeholder region 30–70",
                    },
                    {
                      start: 90,
                      end: 100,
                      color: "rgb(0,120,255)",
                      tooltipContent: "Placeholder region 90–100",
                    },
                  ],
                },
              ],
              uuid: "placeholder_track_item_1",
            },
          ],
          uuid: "placeholder_track",
        },
      ];
    </script>

    <!-- Legacy/polyfill dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/babel-polyfill/dist/polyfill.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@webcomponents/webcomponentsjs/webcomponents-lite.js"
      charset="utf-8"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@webcomponents/webcomponentsjs/custom-elements-es5-adapter.js"
      charset="utf-8"
    ></script>
  </body>
</html>
