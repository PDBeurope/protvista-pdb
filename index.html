<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Migrated PDB Protvista demo</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Icon fonts stylesheet -->
    <link
      rel="stylesheet"
      href="https://ebi.emblstatic.net/web_guidelines/EBI-Icon-fonts/v1.2/fonts.css"
      type="text/css"
      media="all"
    />
    <!-- <link rel="stylesheet" href="/styles/protvista-pdb.css">
    <link rel="stylesheet" href="/styles/protvista-variation.css"> -->
    <!-- <link rel="stylesheet" href="/dist/protvista-pdb-4.0.0-mddb.min.css"> -->
  </head>
  <body>
    <h1>Migrated PDB Protvista demo</h1>

    <div id="protvista-demo"></div>

    <script type="module">
      const demos = {
        protein: {
          accession: "P24666",
          "sticky-header": "true",
        },

        entry: {
          "entry-id": "1trn",
          "entity-id": "1",
        },

        ligand: {
          "ligand-id": "STI",
        },

        sasa: {
          accession: "P01178",
          "api-names":
            "unipdb,secondary_structure_variation,ligand_sites,interface_residues,annotations,rsa_distribution",
          "always-expanded": "rsa_distribution",
        },

        memprot: {
          accession: "G2FID1",
        },

        expanded: {
          accession: "P24666",
          "max-height": "600px",
          "always-expanded":
            "unipdb,ligand_sites,interface_residues,annotations,3dbeacons,sequence_conservation,variation",
          "enable-in3d": true,
          "trigger-first-in3d": true,
        },

        customTracks: {
          accession: "P24666",
          "max-height": "600px",
          "always-expanded":
            "unipdb,ligand_sites,interface_residues,annotations,3dbeacons,sequence_conservation,variation",
          "enable-in3d": true,
          "trigger-first-in3d": true,
          "add-custom-track": true,
          "new-toolbar": true,
        },
      };

      // 👇 Only change this to switch demo
      const activeDemo = new URLSearchParams(window.location.search).get("demo") ?? "sasa";

      const protvista = document.createElement("protvista-pdb");

      Object.entries(demos[activeDemo]).forEach(([name, value]) => {
        if (value === true) {
          protvista.setAttribute(name, "");
        } else if (value !== false && value != null) {
          protvista.setAttribute(name, value);
        }
      });

      document.querySelector("#protvista-demo").append(protvista);
    </script>

    <script type="module" src="/src/index.js"></script>

    <!-- Legacy/polyfill dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/babel-polyfill/dist/polyfill.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@webcomponents/webcomponentsjs/webcomponents-lite.js"
      charset="utf-8"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@webcomponents/webcomponentsjs/custom-elements-es5-adapter.js"
      charset="utf-8"
    ></script>
  </body>
</html>
