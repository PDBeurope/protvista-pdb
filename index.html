    <script type="module">
      const pv = document.querySelector("protvista-pdb");

      pv.pinneddata = [
        {
          labelType: "text",

          data: [
            {
              accession: "placeholder",
              labelType: "text",

              labelTooltip: "Example placeholder track",
              locations: [
                {
                  fragments: [
                    {
                      start: 30,
                      end: 70,
                      color: "rgb(0,120,255)",
                      tooltipContent: "Placeholder region 30–70",
                    },
                    {
                      start: 90,
                      end: 100,
                      color: "rgb(0,120,255)",
                      tooltipContent: "Placeholder region 90–100",
                    },
                  ],
                },
              ],
              uuid: "placeholder_track_item_1",

          ],
